executor: slurm
jobs: 32
use-conda: true
default-resources:
  slurm_partition: common
  mem_mb: 16000
  runtime: 120
  cpus_per_task: 1
set-resources:
  discover_members:
    mem_mb: 32000
    runtime: 180
  count:
    mem_mb: 24000
    runtime: 120
  find_motifs:
    mem_mb: 32000
    runtime: 360        # an RM-deficient strain is the SLOW case, not the fast one
    cpus_per_task: 4
retries: 1
printshellcmds: true
rerun-incomplete: true
