name: Publish to PyPI

# Runs when a GitHub release is published (create it from the vX.Y.Z tag on main).
# Uses PyPI trusted publishing: no token is stored in the repository.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Point README images at the tagged commit (PyPI cannot show relative paths)
        run: sed -i "s#](index_files/#](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/index_files/#g" README.md
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('randseq/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: Build
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
